name: ThreeLiveStudio
options:
  bundleIdPrefix: com.kaisun
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  CreationCore:
    path: Packages/CreationCore
  QwenNative:
    path: Packages/QwenNative
  ThreeLiveNative:
    path: Packages/ThreeLiveNative
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: M97RTV2PQG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThreeLiveStudio:
    type: application
    platform: iOS
    sources:
      - path: ThreeLiveStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaisun.voxamber
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ThreeLiveStudio/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: CreationCore
      - package: QwenNative
      - package: ThreeLiveNative
    scheme:
      testTargets:
        - ThreeLiveStudioTests
        - ThreeLiveStudioUITests
  ThreeLiveStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ThreeLiveStudioTests]
    dependencies:
      - target: ThreeLiveStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ThreeLiveStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ThreeLiveStudioUITests]
    dependencies:
      - target: ThreeLiveStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
